<!doctype html><html><head><title>Responsive QA</title></head><body style="margin:0"><script>const w=Number(new URLSearchParams(location.search).get("w"))||1440;const f=document.createElement("iframe");f.title="Responsive preview";f.src="/";f.width=w;f.height=1000;f.style="border:0;display:block";document.body.style.width=w+"px";const report=document.createElement("pre");report.id="report";document.body.prepend(report);f.onload=()=>{setTimeout(()=>{const d=f.contentDocument;report.textContent=JSON.stringify({width:w,client:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,overflow:[...d.querySelectorAll("body *")].filter(e=>{const r=e.getBoundingClientRect();return r.right>d.documentElement.clientWidth+2&&r.width>0}).map(e=>e.className).slice(0,8)});report.setAttribute("data-ready","true")},700)};document.body.append(f);</script></body></html>
